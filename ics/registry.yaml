# InfraFlow Component Standard v0.1: closed registries.
# Extending a registry means releasing a new version of the standard.
ics_version: "0.1"

port_types:
  net.vpc/v1:            [vpc_id, public_subnet_ids, private_subnet_ids, private_route_table_id]
  net.egress/v1:         [nat_gateway_id]
  db.postgres/v1:        [host, port, name, user, password_param, security_group_id]
  http.backend/v1:       [instance_id, port, health_path, security_group_id]
  http.public/v1:        [dns_name, zone_id]
  cache.redis/v1:        [host, port, security_group_id]
  queue.sqs/v1:          [queue_url, queue_arn]
  storage.ebs/v1:        [volume_id, availability_zone]
  lb.target/v1:          [target_group_arn, security_group_id]
  search.opensearch/v1:  [endpoint, security_group_id]
  workload.container/v1: [image, port, health_path]

# Permitted resource types with their actual billing class (checked by S5).
# class: the billing class this resource forces on its component (null = unconstrained).
# data: holds data that must survive sleep. volatile: holds data that is lost when removed.
resource_types:
  aws_vpc:                             { class: free }
  aws_internet_gateway:                { class: free }
  aws_subnet:                          { class: free }
  aws_route_table:                     { class: free }
  aws_route_table_association:         { class: free }
  aws_route:                           { class: null }
  aws_security_group:                  { class: null }
  aws_vpc_security_group_ingress_rule: { class: null }
  aws_vpc_security_group_egress_rule:  { class: null }
  aws_eip:                             { class: hourly_no_data }
  aws_nat_gateway:                     { class: hourly_no_data }
  aws_lb:                              { class: hourly_no_data }
  aws_lb_target_group:                 { class: null }
  aws_lb_target_group_attachment:      { class: null }
  aws_lb_listener:                     { class: null }
  aws_instance:                        { class: stoppable }
  aws_iam_role:                        { class: null }
  aws_iam_role_policy:                 { class: null }
  aws_iam_role_policy_attachment:      { class: null }
  aws_iam_instance_profile:            { class: null }
  aws_db_instance:                     { class: data, data: true }
  aws_db_subnet_group:                 { class: null }
  aws_ssm_parameter:                   { class: null }
  aws_ebs_volume:                      { class: data, data: true }
  aws_elasticache_cluster:             { class: hourly_no_data, volatile: true }
  aws_elasticache_subnet_group:        { class: null }
  aws_volume_attachment:               { class: null }
  aws_sqs_queue:                       { class: free }
  aws_ecs_cluster:                     { class: null }
  aws_ecs_task_definition:             { class: null }
  aws_ecs_service:                     { class: stoppable }
  aws_cloudwatch_log_group:            { class: null }
  aws_opensearch_domain:               { class: hourly_no_data, volatile: true }
  random_password:                     { class: null }

drivers:
  - vpc.describe
  - nat_gateway.describe
  - ec2_instance.describe
  - ec2_instance.start
  - ec2_instance.stop
  - ec2_instance.status_ok
  - rds_instance.describe
  - rds_instance.start
  - rds_instance.stop
  - rds_instance.snapshot
  - rds_instance.available
  - elbv2.describe
  - elasticache.describe
  - ec2_bastion.describe
  - ec2_bastion.start
  - ec2_bastion.stop
  - ec2_bastion.status_ok
  - ec2_workbench.describe
  - ec2_workbench.start
  - ec2_workbench.stop
  - ec2_workbench.status_ok
  - ebs_volume.describe
  - ebs_volume.snapshot
  - ecs_service.describe
  - ecs_service.start
  - ecs_service.stop
  - sqs.describe
  - opensearch.describe
  - elbv2.target_healthy
  - dns.point
  - wait.seconds
  - terraform.presence
  - terraform.restore

# Data classes of a component (checked by S5)
#   persistent: must survive every level; snapshotted before removal
#   retained:   kept while the resource exists (all sleep levels), not backed up at reclaim
#   ephemeral:  lost when the resource is removed on sleep
data_classes: [none, persistent, retained, ephemeral]

# Categories a Blueprint may declare (checked by M1)
categories:
  web:    "Web application or API reachable through a public URL"
  worker: "Background processing without a public URL"
  data:   "Data service for analysis or integration testing"
  ml:     "Machine learning workstation or training job"

# Billing class -> valid states
classes:
  free:           { states: [ABSENT, PRESENT],                        initial: PRESENT }
  stoppable:      { states: [ABSENT, RUNNING, STOPPED],               initial: RUNNING }
  hourly_no_data: { states: [ABSENT, PRESENT],                        initial: PRESENT }
  data:           { states: [ABSENT, RUNNING, STOPPED, SNAPSHOTTED],  initial: RUNNING }
