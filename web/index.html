<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.amazonaws.com; base-uri 'none'; form-action 'self'; object-src 'none'">
  <meta name="theme-color" content="#0b0f14">
  <title>InfraFlow</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <header class="app-header">
    <a class="brand" href="#/" aria-label="InfraFlow home"><img src="logo.svg" alt="InfraFlow" width="133" height="34"></a>
    <nav id="nav" class="nav" aria-label="Primary" hidden>
      <a href="#/">Environments</a>
      <a href="#/new">New Lease</a>
      <a href="#/compose">Compose</a>
      <a href="#/admin" id="nav-admin" hidden>Admin</a>
    </nav>
    <div class="header-user">
      <span id="who"></span>
      <button id="sign-out" type="button" class="btn ghost" hidden>Sign out</button>
    </div>
  </header>
  <main id="view" tabindex="-1"></main>
  <dialog id="confirm" class="dialog" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <div id="confirm-body"></div>
      <div class="dialog-actions">
        <button value="cancel" class="btn ghost" type="submit">Cancel</button>
        <button value="ok" id="confirm-ok" class="btn primary" type="submit"></button>
      </div>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
