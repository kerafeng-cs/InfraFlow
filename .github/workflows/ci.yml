name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  ics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Unit test (planner, model checker, validator, compiler, controller, API, executor)
        working-directory: services
        run: python -m unittest discover -s tests -t . -v
      - name: ICS checks for the whole catalog (static, composition, model checking)
        working-directory: services
        run: python -m infraflow.cli check
      - name: catalog.json matches the YAML sources
        working-directory: services
        run: |
          python -m infraflow.cli bundle
          git diff --exit-code infraflow/catalog.json

  terraform:
    runs-on: ubuntu-latest
    env:
      # One provider download for all module directories instead of one per directory: fewer
      # downloads that a network reset can break, and no 800 MB copy of the AWS provider each.
      # The lock files record the Windows h1 checksum only, so the cache needs explicit permission.
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/../plugin-cache
      TF_PLUGIN_CACHE_MAY_BREAK_DEPENDENCY_LOCK_FILE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - run: terraform fmt -check -recursive components platform
      - name: validate components and platform
        run: |
          failed=0
          for d in components/*/*/ platform/; do
            echo "== $d"
            ok=0
            for attempt in 1 2 3; do
              if terraform -chdir="$d" init -backend=false -input=false -no-color > "$RUNNER_TEMP/init.log" 2>&1; then
                ok=1
                break
              fi
              echo "init failed (attempt $attempt), retrying"
              sleep 10
            done
            if [ "$ok" -eq 0 ]; then
              cat "$RUNNER_TEMP/init.log"
              failed=1
            elif ! terraform -chdir="$d" validate -no-color; then
              failed=1
            fi
            rm -rf "${d}.terraform"
          done
          df -h /
          exit $failed
