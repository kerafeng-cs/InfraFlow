ics_version: "0.1"
component:
  name: aws-opensearch-domain
  version: 1.0.0
  owner: infraflow
  summary: "Single-node OpenSearch domain in a private subnet; the index is rebuilt after each wake"
  billing_class: hourly_no_data
  data_class: ephemeral
  resource_types:
    - aws_opensearch_domain
    - aws_security_group
    - aws_vpc_security_group_ingress_rule
    - aws_ssm_parameter
  data_resource_types: []
  primary_resource: aws_opensearch_domain.this
  system_inputs: [name_prefix, env_id]
provides:
  - port: search
    type: search.opensearch/v1
    attributes: { endpoint: endpoint, security_group_id: security_group_id }
requires:
  - port: net
    type: net.vpc/v1
    when: present
    inputs: { vpc_id: vpc_id, private_subnet_ids: subnet_ids }
parameters:
  size: { type: string, enum: [small, medium], default: small }
outputs:
  endpoint:          { stable: false }   # a new domain on every wake; clients read it from SSM
  security_group_id: { stable: false }
lifecycle:
  presence_variable: present
  actions:
    observe: { driver: opensearch.describe }
  levels: { awake: PRESENT, shallow: PRESENT, deep: ABSENT, hibernate: ABSENT }
  serving_states: [PRESENT]
health:
  probe: { driver: terraform.presence, timeout_s: 1800 }
cost:
  - { meter: opensearch_instance_hour, in_states: [PRESENT], param: size }
  - { meter: ebs_gb_month,             in_states: [PRESENT] }
conformance:
  claimed_level: L1
