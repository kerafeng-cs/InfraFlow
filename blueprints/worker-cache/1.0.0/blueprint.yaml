ics_version: "0.1"
blueprint:
  name: worker-cache
  version: 1.0.0
  owner: infraflow
  summary: "Background worker (Docker on EC2) with a Redis queue and no public URL"
  exposure: none
  classification:
    category: worker
    use_cases: ["Queue consumers whose jobs may be discarded on sleep", "Load generators and test runners that coordinate through Redis"]
parameters:
  size: { type: string, enum: [small, medium], default: small }
instances:
  network:  { component: aws-network-basic@1.0.0 }
  egress:   { component: aws-nat-egress@1.0.0 }
  cache:    { component: aws-elasticache-redis@1.0.0, parameters: { size: "${param.size}" } }
  app:      { component: aws-ec2-docker-app@1.1.0,    parameters: { size: "${param.size}" } }
bindings:                     # from = requires side, to = provides side
  - { from: egress.net,   to: network.net }
  - { from: cache.net,    to: network.net }
  - { from: app.net,      to: network.net }
  - { from: app.egress,   to: egress.egress }
  - { from: app.cache,    to: cache.cache }
  - { from: app.workload, to: sys.lease_app }
supported_levels: [awake, deep, hibernate]
