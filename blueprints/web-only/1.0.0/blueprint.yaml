ics_version: "0.1"
blueprint:
  name: web-only
  version: 1.0.0
  owner: infraflow
  summary: "Stateless web application (Docker on EC2) behind an ALB, without a database"
  exposure: public
  classification:
    category: web
    use_cases: ["Frontend or API preview that keeps no data of its own", "Demo of a service that calls external APIs only"]
parameters:
  size: { type: string, enum: [small, medium], default: small }
instances:
  network: { component: aws-network-basic@1.0.0 }
  egress:  { component: aws-nat-egress@1.0.0 }
  app:     { component: aws-ec2-docker-app@1.1.0, parameters: { size: "${param.size}" } }
  entry:   { component: aws-alb-https-entry@1.0.0 }
bindings:                     # from = requires side, to = provides side
  - { from: egress.net,    to: network.net }
  - { from: app.net,       to: network.net }
  - { from: app.egress,    to: egress.egress }
  - { from: app.workload,  to: sys.lease_app }
  - { from: entry.net,     to: network.net }
  - { from: entry.backend, to: app.http }
  - { from: sys.dns,       to: entry.public }
supported_levels: [awake, deep, hibernate]
