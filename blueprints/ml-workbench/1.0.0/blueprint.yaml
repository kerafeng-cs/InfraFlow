ics_version: "0.1"
blueprint:
  name: ml-workbench
  version: 1.0.0
  owner: infraflow
  summary: "NVIDIA GPU instance running a notebook or training image, with a persistent data volume"
  exposure: none
  classification:
    category: ml
    use_cases: ["JupyterLab with a GPU for experiments, stopped outside working hours", "Fine-tuning runs whose datasets and checkpoints must survive sleep"]
parameters:
  size: { type: string, enum: [small, medium], default: small }
instances:
  network:   { component: aws-network-basic@1.0.0 }
  egress:    { component: aws-nat-egress@1.0.0 }
  volume:    { component: aws-ebs-volume@1.0.0,        parameters: { size: "${param.size}" } }
  workbench: { component: aws-ec2-gpu-workbench@1.0.0, parameters: { size: "${param.size}" } }
bindings:                     # from = requires side, to = provides side
  - { from: egress.net,         to: network.net }
  - { from: volume.net,         to: network.net }
  - { from: workbench.net,      to: network.net }
  - { from: workbench.egress,   to: egress.egress }
  - { from: workbench.volume,   to: volume.volume }
  - { from: workbench.workload, to: sys.lease_app }
supported_levels: [awake, deep, hibernate]
